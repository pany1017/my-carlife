name: 构建车机APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取代码
      - name: 1. 获取源码
        uses: actions/checkout@v4

      # 2. 设置 JDK 11
      - name: 2. 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 强制编译（终极版）
      - name: 3. 强制编译
        run: |
          echo "=== 开始终极修复 ==="
          
          # 1. 强制切换到项目根目录
          cd CarLifeLauncherYunOS || exit 1
          
          # 2. 暴力修复换行符（针对 Windows 上传的文件）
          sed -i 's/\r$//' gradlew
          
          # 3. 强行赋予所有权限
          chmod +x gradlew
          
          # 4. 直接执行构建
          ./gradlew assembleDebug --stacktrace

      # 4. 上传 APK
      - name: 4. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLife-YunOS-安装包
          path: CarLifeLauncherYunOS/app/build/outputs/apk/debug/*.apk
