name: 构建车机APK

# 强制兼容模式
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取代码 (关键修改：fetch-depth: 0 强制拉取所有文件，包括隐藏的 gradlew)
      - name: 1. 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. 设置 JDK 11
      - name: 2. 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 智能编译
      - name: 3. 开始编译
        run: |
          echo "--- 开始寻找构建脚本 ---"
          
          # 判断是 Windows 还是 Linux 环境
          if [ -f "gradlew" ]; then
            echo "✅ 发现 Linux 脚本 (gradlew)"
            bash gradlew assembleDebug
          elif [ -f "gradlew.bat" ]; then
            echo "✅ 发现 Windows 脚本 (gradlew.bat)"
            chmod +x gradlew.bat
            ./gradlew.bat assembleDebug
          else
            echo "❌ 严重错误：既找不到 gradlew 也找不到 gradlew.bat！"
            echo "当前目录内容："
            ls -la
            exit 1
          fi

      # 4. 上传 APK
      - name: 4. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLife-YunOS-安装包
          path: app/build/outputs/apk/debug/*.apk
