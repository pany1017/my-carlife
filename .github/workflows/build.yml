name: 构建车机APK

# 强制兼容模式
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取代码 (强制全量下载，包括隐藏文件)
      - name: 1. 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. 设置 JDK 11
      - name: 2. 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 智能编译 (Windows 脚本 + 路径调试)
      - name: 3. 开始编译
        run: |
          echo "=== 开始调试 ==="
          
          # 强制切换到项目根目录 (CarLifeLauncherYunOS)
          cd CarLifeLauncherYunOS || { echo "❌ 无法进入项目目录！"; exit 1; }
          
          echo "✅ 当前工作目录：$(pwd)"
          echo "📂 当前目录内容："
          ls -la
          
          # 检查 gradlew.bat 是否存在
          if [ -f "gradlew.bat" ]; then
            echo "✅ 发现 Windows 脚本 (gradlew.bat)"
            chmod +x gradlew.bat
            ./gradlew.bat assembleDebug
          else
            echo "❌ 严重错误：连 gradlew.bat 也找不到！"
            exit 1
          fi

      # 4. 上传 APK
      - name: 4. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLife-YunOS-安装包
          path: CarLifeLauncherYunOS/app/build/outputs/apk/debug/*.apk
