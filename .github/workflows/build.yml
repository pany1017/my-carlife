name: Build APK

# 👇 确保 env 顶格写，前面没有任何空格
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 赋予权限并编译
      - name: Grant execute permission and build
        run: |
          sed -i 's/:\\r$$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      # 4. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLife-YunOS-APK
          path: app/build/outputs/apk/debug/*.apk
