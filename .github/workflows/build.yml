name: 构建车机APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取代码（全量，防止漏掉 gradlew）
      - name: 1. 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 JDK 11
      - name: 2. 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 编译（终极容错版）
      - name: 3. 开始编译
        run: |
          set -e
          echo "=== 开始编译 ==="

          # 【包容点1】强制进入项目根目录
          cd CarLifeLauncherYunOS

          # 【包容点2】确认 gradlew 存在
          if [ ! -f "gradlew" ]; then
            echo "❌ 致命：gradlew 不存在！"
            ls -la
            exit 1
          fi

          # 【包容点3】修复 Windows 上传导致的换行符 CRLF 问题
          sed -i 's/\r$//' gradlew

          # 【包容点4】强制赋予执行权限
          chmod +x gradlew

          # 【包容点5】锁定 Gradle 版本，防止 wrapper 下载错版本
          echo "🔍 当前 Gradle 版本配置："
          grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties

          # 【包容点6】国内镜像加速（解决依赖下载超时）
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
            repositories {
              maven { url 'https://maven.aliyun.com/repository/public/' }
              maven { url 'https://maven.aliyun.com/repository/google/' }
              maven { url 'https://maven.aliyun.com/repository/gradle-plugin/' }
              google()
              mavenCentral()
            }
          }
          EOF

          # 开始构建
          echo "🚀 开始构建 APK..."
          ./gradlew assembleDebug --stacktrace --info

      # 4. 上传 APK
      - name: 4. 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarLife-YunOS-APK
          path: CarLifeLauncherYunOS/app/build/outputs/apk/debug/*.apk
