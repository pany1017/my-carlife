name: 构建车机APK

# 强制兼容模式
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: false

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取代码
      - name: 1. 获取源码
        uses: actions/checkout@v4

      # 2. 设置 JDK 11
      - name: 2. 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 编译 (直接调用 bash，避免权限问题)
      - name: 3. 开始编译
        run: |
          echo "--- 开始执行编译 ---"
          
          # 修复换行符
          sed -i 's/\r$//' gradlew
          
          # 直接通过 bash 运行，不需要 chmod +x
          bash gradlew assembleDebug

      # 4. 上传 APK
      - name: 4. 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: CarLife-YunOS-安装包
          path: app/build/outputs/apk/debug/*.apk
