name: 构建车机APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取代码
      - name: 1. 获取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 JDK 11
      - name: 2. 设置 Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 编译与强力搜索
      - name: 3. 强力搜索并上传 APK
        run: |
          set -e
          echo "=== 开始执行打包与搜索 ==="

          # 进入项目目录
          cd CarLifeLauncherYunOS

          # 修复换行符和权限
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          # 开始构建
          echo "🚀 开始构建..."
          ./gradlew assembleDebug --stacktrace

          echo "🔍 构建结束，开始地毯式搜索 APK 文件..."
          
          # 在整个项目目录下搜索任何后缀为 .apk 的文件
          APK_PATH=$(find . -name "*.apk" -type f | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "❌❌❌ 严重错误：整个服务器里都没找到 APK 文件！"
            echo "💡 可能原因：Gradle 构建虽然没报错，但没生成包（比如被 Lint 拦截了）。"
            echo "正在列出构建输出目录的内容供你排查："
            ls -R app/build/outputs/ || echo "连 outputs 目录都没生成！"
            exit 1
          else
            echo "✅✅✅ 成功捕获到 APK！"
            echo "📂 文件绝对路径：$PWD/$APK_PATH"
            
            # 创建一个软链接到根目录，确保上传组件能找到它
            ln -sf "$PWD/$APK_PATH" ./output.apk
            
            echo "🚀 准备上传该文件..."
            gh release upload v0.1 ./output.apk --clobber || echo "⚠️ 上传过程有警告，请查看上方日志"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. 兜底上传 (如果上面脚本意外失败，这个作为保底)
      - name: 4. 标准上传构件
        if: success() || failure() # 无论成功失败都尝试上传日志和可能存在的文件
        uses: actions/upload-
