name: Build APK

on:
  push:
    branches: [ main ]  # 每次你上传文件，它就自动编译

jobs:
  build:
    runs-on: ubuntu-latest  # 使用云端 Linux 电脑

    steps:
      # 1. 把你的代码下载下来
      - uses: actions/checkout@v4

      # 2. 云端的电脑自带了 Java 和 Android SDK，直接用
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
# 1. 修复 Windows 换行符并赋予权限
      - name: Fix gradlew and grant permission
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          
      # 2. 开始编译
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      # 3. 赋予 gradlew 权限并编译
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 4. 把编译好的 APK 发回给你
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: CarLife-YunOS-APK
          path: app/build/outputs/apk/debug/*.apk
