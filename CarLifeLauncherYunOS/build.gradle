buildscript {
    repositories {
        // 1. 优先使用阿里云镜像下载插件
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        
        // 2. 如果镜像没有，再走官方源（兜底）
        google()
        mavenCentral()
        jcenter() // 建议保留，有些老项目需要，虽然已停用但不影响编译
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.1.4' // 保持你原有的版本
    }
}

allprojects {
    repositories {
        // 1. 优先使用阿里云镜像下载项目依赖
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        
        // 2. 兜底
        google()
        mavenCentral()
        jcenter()
    }
}