buildscript {
    repositories {
        // 1. 添加阿里云镜像 (最快)
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        
        // 2. 保留原来的 google() 和 mavenCentral()
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.0' // 你的版本号可能不同
    }
}

// 项目依赖
allprojects {
    repositories {
        // 1. 同样添加阿里云镜像
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://maven.aliyun.com/repository/google/' }
        
        google()
        mavenCentral()
    }
}
